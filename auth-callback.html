<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
    <title>Sign in | Harinam Joli</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #29231f; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 380px; padding: 32px; text-align: center; }
      h1 { color: #7d1f00; font: 30px/1.3 Georgia, serif; }
      button { border: 0; border-radius: 4px; padding: 12px 24px; background: #7d1f00; color: #fff; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 2px solid #7d1f00; outline-offset: 4px; }
    </style>
    <script src="js/auth-callback.js?v=1" defer></script>
  </head>
  <body>
    <main>
      <h1>Harinam Joli</h1>
      <p id="auth-callback-status" role="status">Completing your sign-in…</p>
      <button id="auth-callback-close" type="button">Close window</button>
    </main>
  </body>
</html>
